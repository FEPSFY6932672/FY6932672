<!DOCTYPE html>
<html>
<head>
    <title>Monthly Sales Chart</title>
    <!-- Include Google Charts API -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
    <!-- Create a div element to hold the chart -->
    <div id="chart_div" style="width: 600px; height: 400px;"></div>

    <script>
        // Load the corechart package and set a callback function
        google.charts.load('current', { 'packages': ['corechart'] });
        google.charts.setOnLoadCallback(drawChart);

        // Callback function to draw the column chart
        function drawChart() {
            // Create a DataTable with columns for month and sales
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Month');
            data.addColumn('number', 'Sales (in GBP)');

            // Add data for each month in 2023
            data.addRows([
                ['January', 25000],
                ['February', 28000],
                ['March', 32000],
                ['April', 27000],
                ['May', 31000],
                ['June', 34000],
                ['July', 38000],
                ['August', 36000],
                ['September', 31000],
                ['October', 29000],
                ['November', 27000],
                ['December', 32000]
            ]);

            // Set chart options and formatting
            var options = {
                title: 'Monthly Sales in 2023',
                hAxis: { title: 'Month' },
                vAxis: { title: 'Sales (in GBP)' },
                colors: ['#3366cc'], // Column color
                legend: 'none', // Hide legend
                animation: {
                    startup: true,
                    duration: 1000,
                    easing: 'out'
                }
            };

            // Create a column chart and place it in the 'chart_div' element
            var chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }
    </script>
</body>
</html>
